services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms_web
    command: bin/rails server -b 0.0.0.0 -p 3000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RAILS_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_data:/bundle
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrms_development
    ports:
      - "5100:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  bundle_data:
  postgres_data:
